<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixFlow | Usuarios</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-roles="ADMIN">
  <header class="topbar">
    <div class="logo">FixFlow</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="clientes.html" data-roles="ADMIN,CLIENTE">Clientes</a>
      <a href="equipos.html" data-roles="ADMIN,CLIENTE">Equipos</a>
      <a href="solicitudes.html" data-roles="ADMIN,CLIENTE,TECNICO">Solicitudes</a>
      <a href="diagnosticos.html" data-roles="ADMIN,TECNICO">Diagnósticos</a>
      <a href="reparaciones.html" data-roles="ADMIN,TECNICO">Reparaciones</a>
      <a id="logoutBtn" href="#">Cerrar sesión</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <div>
        <p class="eyebrow">Administración</p>
        <h1>Gestión de usuarios</h1>
      </div>
    </section>

    <section class="manager-grid">
      <div class="panel">
        <h2 id="formTitle">Nuevo usuario</h2>
        <form id="usuarioForm" class="stack-form">
          <input type="hidden" id="usuarioId" />

          <label>
            <span>Nombre</span>
            <input type="text" id="nombreInput" required />
          </label>

          <label>
            <span>Apellido</span>
            <input type="text" id="apellidoInput" required />
          </label>

          <label>
            <span>Email</span>
            <input type="email" id="emailInput" required />
          </label>

          <label>
            <span>Contraseña <small id="passwordHint" class="muted">(mínimo 6 caracteres)</small></span>
            <input type="password" id="passwordInput" minlength="6" />
          </label>

          <label>
            <span>Rol</span>
            <select id="rolInput" required>
              <option value="ADMIN">Administrador</option>
              <option value="TECNICO">Técnico</option>
              <option value="CLIENTE">Cliente</option>
            </select>
          </label>

          <label>
            <span>Estado</span>
            <select id="estadoInput">
              <option value="ACTIVO">Activo</option>
              <option value="INACTIVO">Inactivo</option>
            </select>
          </label>

          <button type="submit" class="button primary" id="saveBtn">Guardar usuario</button>
          <button type="button" class="button tiny" id="cancelEditBtn" hidden>Cancelar edición</button>
        </form>
        <p id="formMessage" class="message"></p>
      </div>

      <div class="panel">
        <h2>Resumen</h2>
        <div class="summary-list">
          <div><span>Usuarios</span><strong id="usuariosCount">0</strong></div>
          <div><span>Activos</span><strong id="activosCount">0</strong></div>
          <div><span>Inactivos</span><strong id="inactivosCount">0</strong></div>
        </div>
      </div>
    </section>

    <section class="panel table-panel">
      <h2>Usuarios registrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usuariosTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
