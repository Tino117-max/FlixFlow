<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixFlow | Equipos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-roles="ADMIN,CLIENTE">
  <header class="topbar">
    <div class="logo">FixFlow</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="usuarios.html" data-roles="ADMIN">Usuarios</a>
      <a href="clientes.html" data-roles="ADMIN,CLIENTE">Clientes</a>
      <a href="equipos.html" data-roles="ADMIN,CLIENTE">Equipos</a>
      <a href="solicitudes.html" data-roles="ADMIN,CLIENTE,TECNICO">Solicitudes</a>
      <a href="diagnosticos.html" data-roles="ADMIN,TECNICO">Diagnósticos</a>
      <a href="reparaciones.html" data-roles="ADMIN,TECNICO">Reparaciones</a>
      <a id="logoutBtn" href="#">Cerrar sesión</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <div>
        <p class="eyebrow">Inventario</p>
        <h1>Gestión de equipos</h1>
      </div>
    </section>

    <section class="manager-grid">
      <div class="panel">
        <h2 id="formTitle">Nuevo equipo</h2>
        <form id="equipoForm" class="stack-form">
          <label>
            <span>Cliente</span>
            <select id="clienteSelect" required></select>
          </label>

          <label>
            <span>Tipo</span>
            <input type="text" id="tipoInput" required />
          </label>

          <label>
            <span>Marca</span>
            <input type="text" id="marcaInput" required />
          </label>

          <label>
            <span>Modelo</span>
            <input type="text" id="modeloInput" required />
          </label>

          <label>
            <span>Serial</span>
            <input type="text" id="serialInput" required />
          </label>

          <label>
            <span>Descripción</span>
            <textarea id="descripcionInput" rows="3"></textarea>
          </label>

          <button type="submit" class="button primary" id="saveBtn">Guardar equipo</button>
          <button type="button" class="button tiny" id="cancelEditBtn" hidden>Cancelar edición</button>
        </form>
        <p id="formMessage" class="message"></p>
      </div>

      <div class="panel">
        <h2>Resumen</h2>
        <div class="summary-list">
          <div><span>Equipos</span><strong id="equiposCount">0</strong></div>
        </div>
      </div>
    </section>

    <section class="panel table-panel">
      <h2>Equipos registrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Tipo</th>
              <th>Marca</th>
              <th>Modelo</th>
              <th>Serial</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="equiposTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/equipos.js"></script>
</body>
</html>
