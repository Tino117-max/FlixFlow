<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixFlow | Reparaciones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-roles="ADMIN,TECNICO">
  <header class="topbar">
    <div class="logo">FixFlow</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="usuarios.html" data-roles="ADMIN">Usuarios</a>
      <a href="clientes.html" data-roles="ADMIN,CLIENTE">Clientes</a>
      <a href="equipos.html" data-roles="ADMIN,CLIENTE">Equipos</a>
      <a href="solicitudes.html" data-roles="ADMIN,CLIENTE,TECNICO">Solicitudes</a>
      <a href="diagnosticos.html">Diagnósticos</a>
      <a href="reparaciones.html">Reparaciones</a>
      <a id="logoutBtn" href="#">Cerrar sesión</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <div>
        <p class="eyebrow">Reparación</p>
        <h1>Gestión de reparaciones</h1>
      </div>
    </section>

    <section class="manager-grid">
      <div class="panel">
        <h2>Nueva reparación</h2>
        <form id="reparacionForm" class="stack-form">
          <label>
            <span>Solicitud</span>
            <select id="solicitudSelect" required></select>
          </label>

          <label>
            <span>Solución</span>
            <textarea id="solucionInput" rows="5" required></textarea>
          </label>

          <label>
            <span>Observaciones</span>
            <textarea id="observacionesInput" rows="3"></textarea>
          </label>

          <button type="submit" class="button primary">Guardar reparación</button>
        </form>
        <p id="formMessage" class="message"></p>
      </div>

      <div class="panel">
        <h2>Resumen</h2>
        <div class="summary-list">
          <div><span>Reparaciones</span><strong id="reparacionesCount">0</strong></div>
        </div>
      </div>
    </section>

    <section class="panel table-panel">
      <h2>Reparaciones registradas</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Solicitud</th>
              <th>Solución</th>
              <th>Observaciones</th>
            </tr>
          </thead>
          <tbody id="reparacionesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reparaciones.js"></script>
</body>
</html>
