<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixFlow | Solicitudes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-roles="ADMIN,CLIENTE,TECNICO">
  <header class="topbar">
    <div class="logo">FixFlow</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="usuarios.html" data-roles="ADMIN">Usuarios</a>
      <a href="solicitudes.html">Solicitudes</a>
      <a href="clientes.html" data-roles="ADMIN,CLIENTE">Clientes</a>
      <a href="equipos.html" data-roles="ADMIN,CLIENTE">Equipos</a>
      <a href="diagnosticos.html" data-roles="ADMIN,TECNICO">Diagnósticos</a>
      <a href="reparaciones.html" data-roles="ADMIN,TECNICO">Reparaciones</a>
      <a id="logoutBtn" href="#">Cerrar sesión</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <div>
        <p class="eyebrow">Operación</p>
        <h1>Gestión de solicitudes</h1>
      </div>
    </section>

    <section class="manager-grid">
      <div class="panel">
        <h2 id="formTitle">Nueva solicitud</h2>
        <form id="solicitudForm" class="stack-form">
          <label>
            <span>Cliente</span>
            <select id="clienteSelect" required></select>
          </label>

          <label>
            <span>Equipo</span>
            <select id="equipoSelect" required></select>
          </label>

          <label>
            <span>Prioridad</span>
            <select id="prioridadSelect" required>
              <option value="BAJA">Baja</option>
              <option value="MEDIA">Media</option>
              <option value="ALTA">Alta</option>
            </select>
          </label>

          <label>
            <span>Descripción</span>
            <textarea id="descripcionInput" rows="4" required></textarea>
          </label>

          <button type="submit" class="button primary" id="saveBtn">Guardar solicitud</button>
          <button type="button" class="button tiny" id="cancelEditBtn" hidden>Cancelar edición</button>
        </form>
        <p id="formMessage" class="message"></p>
      </div>

      <div class="panel">
        <h2>Resumen</h2>
        <div class="summary-list">
          <div><span>Total</span><strong id="totalSolicitudes">0</strong></div>
          <div><span>Pendientes</span><strong id="pendientesCount">0</strong></div>
          <div><span>En reparación</span><strong id="reparacionCount">0</strong></div>
          <div><span>Finalizadas</span><strong id="finalizadasCount">0</strong></div>
        </div>
      </div>
    </section>

    <section class="panel table-panel">
      <h2>Solicitudes registradas</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Equipo</th>
              <th>Prioridad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="solicitudesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/solicitudes.js"></script>
</body>
</html>
