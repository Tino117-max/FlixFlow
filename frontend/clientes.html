<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixFlow | Clientes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-roles="ADMIN,CLIENTE">
  <header class="topbar">
    <div class="logo">FixFlow</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="usuarios.html" data-roles="ADMIN">Usuarios</a>
      <a href="clientes.html" data-roles="ADMIN,CLIENTE">Clientes</a>
      <a href="equipos.html" data-roles="ADMIN,CLIENTE">Equipos</a>
      <a href="solicitudes.html" data-roles="ADMIN,CLIENTE,TECNICO">Solicitudes</a>
      <a href="diagnosticos.html" data-roles="ADMIN,TECNICO">Diagnósticos</a>
      <a href="reparaciones.html" data-roles="ADMIN,TECNICO">Reparaciones</a>
      <a id="logoutBtn" href="#">Cerrar sesión</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <div>
        <p class="eyebrow">Administración</p>
        <h1>Gestión de clientes</h1>
      </div>
    </section>

    <section class="manager-grid">
      <div class="panel">
        <h2>Nuevo cliente</h2>
        <form id="clienteForm" class="stack-form">
          <label>
            <span>Usuario</span>
            <select id="usuarioSelect" required></select>
          </label>

          <label>
            <span>Teléfono</span>
            <input type="text" id="telefonoInput" required />
          </label>

          <label>
            <span>Dirección</span>
            <input type="text" id="direccionInput" required />
          </label>

          <button type="submit" class="button primary">Guardar cliente</button>
        </form>
        <p id="formMessage" class="message"></p>
      </div>

      <div class="panel">
        <h2>Resumen</h2>
        <div class="summary-list">
          <div><span>Clientes</span><strong id="clientesCount">0</strong></div>
        </div>
      </div>
    </section>

    <section class="panel table-panel">
      <h2>Clientes registrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Teléfono</th>
              <th>Dirección</th>
            </tr>
          </thead>
          <tbody id="clientesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
